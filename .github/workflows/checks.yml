# Automated checks. GitHub runs them on its own machines for every push to
# the main branch and for every pull request, and shows a green tick or a red
# cross next to the commit.
#
# Nothing here needs a secret, a model or a GPU: the tests use pretend
# services (see README, "Tests").
name: Checks

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch: # also allows "Run workflow" by hand on the Actions page

# The checks only read the code. They cannot change the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run for the older one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep the same version as in .pre-commit-config.yaml. When changing it,
      # replace the checksum with the linux_x64 line of the release's
      # "checksums.txt" file.
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # every commit, not only the newest: a key removed later is still a leaked key
          persist-credentials: false
      - name: Download gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum --check
          tar -xzf "${file}" gitleaks
      - name: Scan all commits for keys and other secrets
        run: |
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 .

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false # one failing combination does not hide the others
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" } # the oldest supported version
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" } # what most users run
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Quick tests
        run: python -m pytest -m "not browser"

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: python -m pytest tests/browser
